[project]
name = "marketlens-mcp"
version = "1.0.0"
description = "Marketlens High-Performance MCP Engine for Indian Capital Markets by Cognivus"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cognivus" }]
keywords = ["mcp", "marketlens", "cognivus", "indian-stock-market", "nse", "bse", "mutual-funds", "mcx", "derivatives"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.9.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
angel = ["smartapi-python>=1.4.0", "pyotp>=2.9.0"]
zerodha = ["kiteconnect>=5.0.0"]
broker = ["smartapi-python>=1.4.0", "pyotp>=2.9.0", "kiteconnect>=5.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
marketlens-mcp = "indian_market_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
